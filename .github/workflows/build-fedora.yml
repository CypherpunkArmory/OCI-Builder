name: Build Fedora

on:
  schedule:
    - cron: '0 17 * * 1'  # every Monday 17:00 UTC (staggered)
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Dockerfile.fedora
      - 'input/**'
      - 'assets/common/**'
      - 'assets/fedora/**'

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: userland-fedora
      upstream_image: fedora:latest
      dockerfile: Dockerfile.fedora
      # fedora:latest is published for amd64 and arm64 only -- no arm/v7 or 386.
      platforms: linux/amd64,linux/arm64
    secrets: inherit
